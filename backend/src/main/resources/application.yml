server:
  port: 8080

spring:
  application:
    name: opspilot-backend
  datasource:
    url: jdbc:h2:mem:opspilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${DB_USERNAME:opspilot}
    password: ${DB_PASSWORD:opspilot}
    driver-class-name: org.postgresql.Driver
